name: tests

on:
  push:
  pull_request:

jobs:
  unit-and-static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 pypdfium2==5.12.1
      - run: python -m py_compile extract-excel-package.py render-pdf-pages.py inspect-pdf.py contextpack_gui.py installer/make-icon.py tests/create-e2e-fixtures.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - shell: powershell
        run: .\tests\test-static.ps1

  package-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install OCR system dependencies
        shell: powershell
        run: |
          choco install tesseract ghostscript --no-progress -y
          $ghostscriptBin = Get-ChildItem 'C:\Program Files\gs' -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1 |
            ForEach-Object { Join-Path $_.FullName 'bin' }
          if ($ghostscriptBin) { $ghostscriptBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
      - shell: powershell
        run: .\setup.ps1 -SkipTesseractInstall
      - shell: powershell
        run: .\tests\test-e2e.ps1

  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - shell: powershell
        run: .\setup.ps1 -SkipTesseractInstall
      - shell: powershell
        run: .\installer\build-installer.ps1 -Version 2.2.0
      - uses: actions/upload-artifact@v6
        with:
          name: ContextPack-Setup
          path: dist/ContextPack-Setup.exe
