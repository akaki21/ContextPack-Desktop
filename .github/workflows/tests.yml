name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile extract-excel-package.py render-pdf-pages.py inspect-pdf.py contextpack_gui.py installer/make-icon.py tests/create-e2e-fixtures.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - shell: powershell
        run: .\tests\test-static.ps1

  package-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install OCR system dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tesseract = 'C:\Program Files\Tesseract-OCR\tesseract.exe'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install tesseract --no-progress -y
            $installExit = $LASTEXITCODE
            if ($installExit -in @(0, 1641, 3010) -and (Test-Path -LiteralPath $tesseract)) { break }
            if ($attempt -eq 3) { throw "Tesseract installation failed after $attempt attempts (exit $installExit)." }
            Start-Sleep -Seconds 15
          }
          & $tesseract --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed Tesseract could not run.' }
          "CONTEXTPACK_TESSERACT=$tesseract" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Split-Path -Parent $tesseract) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - shell: powershell
        run: .\setup.ps1 -SkipTesseractInstall
      - shell: powershell
        run: .\tests\test-e2e.ps1 -SkipPdfOcr
      - shell: powershell
        run: .\tests\test-library.ps1

  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - shell: powershell
        run: .\setup.ps1 -SkipTesseractInstall
      - shell: powershell
        run: .\installer\build-installer.ps1 -Version 2.3.1
      - uses: actions/upload-artifact@v6
        with:
          name: ContextPack-Setup
          path: dist/ContextPack-Setup.exe
