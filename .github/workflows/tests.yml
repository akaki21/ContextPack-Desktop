name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 pypdfium2==5.12.1
      - run: python -m py_compile extract-excel-package.py render-pdf-pages.py inspect-pdf.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - shell: powershell
        run: .\tests\test-static.ps1
